<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>pdf render</title></head>
<body>
<script type="module">
import * as pdfjs from './node_modules/pdfjs-dist/legacy/build/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = './node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs';

window.renderPDF = async (fileUrl, maxPages, scale) => {
  const doc = await pdfjs.getDocument({ url: fileUrl, useSystemFonts: true }).promise;
  const n = Math.min(doc.numPages, maxPages || 999);
  const out = [];
  for (let i = 1; i <= n; i++) {
    const page = await doc.getPage(i);
    const vp = page.getViewport({ scale: scale || 1.7 });
    const cv = document.createElement('canvas');
    cv.width = Math.floor(vp.width);
    cv.height = Math.floor(vp.height);
    const ctx = cv.getContext('2d', { alpha: false });
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvas: cv, canvasContext: ctx, viewport: vp }).promise;
    out.push(cv.toDataURL('image/png'));
  }
  return { pages: doc.numPages, images: out };
};
window.READY = true;
</script>
</body></html>
