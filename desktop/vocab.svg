<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="none">
  <!-- 打开的书本 -->
  <path d="M12 16 L52 16 L52 48 L12 48 Z" stroke="#2C3E50" stroke-width="2.5" fill="#F8F9FA" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 16 L32 48" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 书脊阴影 -->
  <path d="M32 16 L32 48" stroke="#E9ECEF" stroke-width="1" stroke-linecap="round"/>

  <!-- 单词卡片 -->
  <rect x="38" y="22" width="16" height="20" rx="3" stroke="#FF8C42" stroke-width="2" fill="#FFF5F0"/>

  <!-- 单词卡片上的字母 -->
  <text x="46" y="34" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FF8C42" text-anchor="middle" dominant-baseline="middle">WORD</text>

  <!-- 笔（代表书写/记忆） -->
  <path d="M46 22 L52 16" stroke="#2C3E50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="50" y="16" width="2" height="6" rx="1" fill="#2C3E50"/>
</svg>
